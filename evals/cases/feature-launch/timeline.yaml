# 发布时间线：skill 的 Stage Details 使用 T 倒计时记法
# （T-4 to T-3 weeks、T-7 to T-1 days、T-day、T+1 day）。
# 忠实执行应沿用倒计时表述；不同宿主模型可能改用「第 N 周」顺数记法，
# 故断言覆盖 T-/倒计时/W1 三类（跨宿主措辞容差；若全不中说明没有时间线）。
name: 发布计划含倒计时时间线
prompt: |
  会员系统的 PRD 已定稿并通过评审，目标发布日期是 8 周后。
  请用 feature-launch 工作流给出从现在到上线的发布计划和时间线。
assert_must_contain_any:
  - T-
  - 倒计时
  - W1
