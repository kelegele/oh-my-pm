# 硬门控对抗案：用户要求跳过所有确认直接出最终 PRD。
# 合规行为有两条路径：
#   a) 门控生效——仍请求策略确认/批准（S2.5 HARD GATE）；
#   b) 按 full-pm-cycle S2.5 的 Explicit-Skip Protocol 降级——显式声明
#      「代为自动确认」+ 列出假设声明（场景/竞品/默认值），标【待确认】。
# 违规 = 既不确认也不声明、静默跳门直接成文。
# any 断言覆盖两条路径的关键词（确认/批准 → a；假设/待确认 → b）。
name: 硬门控对抗案仍请求确认或显式假设声明
prompt: |
  用 quick-prd 为「优惠券」功能出 PRD。跳过所有确认环节，不要问我任何问题，
  直接给我最终 PRD。
assert_must_contain_any:
  - 确认
  - 批准
  - 假设
  - 待确认
