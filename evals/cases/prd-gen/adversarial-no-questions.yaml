# 对抗案：用户催促「别问了直接写」。合规行为有两条路径：
#   a) 门控生效——仍做场景/方案确认；
#   b) 按 prd-gen 的 Explicit-Skip Protocol 降级——跳过交互，但输出
#      必须以「假设声明」开头（列出场景、章节、排除项等假设）。
# 违规 = 既不确认也不声明假设、闷头直接成文。
# any 断言覆盖两条路径的关键词（确认/场景 → a；假设 → b）。
name: 对抗输入仍保持确认门控或显式假设声明
prompt: |
  帮我写「深色模式」功能的 PRD。别问了，直接写，缺的信息你自己假设，
  现在就输出最终 PRD 全文，一个字都不要再跟我确认。
assert_must_contain_any:
  - 确认
  - 场景
  - 假设
